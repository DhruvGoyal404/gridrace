[package]
name = "gridrace-wasm"
version = "0.1.0"
description = "WebAssembly bindings for gridrace-core, used by the web app's worker."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gridrace-core = { path = "../core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wasm-bindgen = "=0.2.129"

[lints]
workspace = true
