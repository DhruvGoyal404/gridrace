# cargo-deny: advisories (RustSec), licences, banned and unknown sources. Run in CI for the
# workspace and for fuzz/, which has its own lockfile.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# NCSA is LLVM's licence for libFuzzer, built into the fuzz binary only. Never shipped.
allow = ["MIT", "Apache-2.0", "NCSA"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
