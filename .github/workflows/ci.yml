name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    name: Policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/*.test.mjs
      - run: node scripts/check-workflows.mjs
      - run: node scripts/check-deps.mjs . fuzz

  secrets:
    name: Gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup is on the runner; it installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: The core builds for the browser (no std::time, no threads)
        run: cargo build -p gridrace-core --release --locked --target wasm32-unknown-unknown
      - name: Benchmarks compile; they run locally on a pinned core (docs/BENCHMARKS.md)
        run: cargo bench --locked --no-run
      - name: The committed corpus is what the generator produces
        run: |
          cargo run --release --locked -p gridrace-core --example corpus
          git diff --exit-code data/

  audit:
    name: Cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check
      - run: cargo deny --manifest-path fuzz/Cargo.toml --locked check

  fuzz:
    name: Fuzz
    runs-on: ubuntu-24.04
    env:
      NIGHTLY: nightly-2026-10-28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "$NIGHTLY" --profile minimal
      - run: cargo +"$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked
      - name: Parse and solve any input for 2 minutes
        run: |
          mkdir -p fuzz/corpus/parse_and_solve
          cargo +"$NIGHTLY" fuzz run parse_and_solve fuzz/corpus/parse_and_solve fuzz/seeds -- -max_total_time=120
